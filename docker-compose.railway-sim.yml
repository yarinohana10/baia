# Local simulation of the Railway production topology.
#
#   browser ──> client (Next standalone, :3070) ──private network──> server (NestJS, NOT published)
#                  │  rewrites /v1/*, /api/auth/*, /uploads/* to http://server:8000
#                  └─ SSR fetches go to http://server:8000 directly
#   server ──> postgres (own container) · LocalStack S3 · Mailpit on the host (:1025)
#
# Same images, NODE_ENV=production and env validation as on Railway; the only
# differences are plain http on localhost and PAYMENT_PROVIDER=mock, which is
# allowed here ONLY because this is a simulation (mock confirms orders without
# charging - it must never be used for a real launch).
#
# Usage (a unique project name keeps it apart from the dev stack). Settings that differ
# per machine, including the REAL Resend API key, live in the git-ignored .env.railsim
# (template: .env.railsim.example) and are interpolated below - never write a key in this file.
#   cp .env.railsim.example .env.railsim              # once
#   R="docker compose -p baia-railsim --env-file .env.railsim -f docker-compose.railway-sim.yml"
#   $R up -d --build
#   $R run --rm migrate                               # = Railway pre-deploy
#   open http://localhost:3070                        (Mailpit UI: http://localhost:8025)
#   $R down -v                                        # removes ONLY this project
#
# Email: by default the API sends to the dev Mailpit (docker-compose.infra.yml) on
# localhost:1025; without it the API logs the failed sends and keeps working.
# For REAL email through Resend, fill in the Resend block of .env.railsim.
# Images are served from http://baia-s3.localhost:9070: browsers resolve
# *.localhost to 127.0.0.1, and the client container maps it to the host.

name: baia-railsim

x-server-env: &server-env
  NODE_ENV: production
  PORT: '8000'
  DATABASE_URL: postgresql://baia:baia@postgres:5432/baia_prodsim?schema=public
  # Simulation-only value (>= 32 chars). Generate a real one for Railway: openssl rand -base64 32
  BETTER_AUTH_SECRET: railsim-local-only-secret-9f8e7d6c5b4a3f2e1d0c
  # Proxy mode: the browser reaches /api/auth through the storefront origin.
  BETTER_AUTH_URL: http://localhost:3070
  CLIENT_URL: http://localhost:3070
  EMAIL_PROVIDER: smtp
  # Defaults = Mailpit on the host. .env.railsim switches to Resend (smtp.resend.com:465, user "resend").
  SMTP_HOST: ${SMTP_HOST:-host.docker.internal}
  SMTP_PORT: ${SMTP_PORT:-1025}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  SMTP_USER: ${SMTP_USER:-railsim}
  SMTP_PASSWORD: ${RESEND_API_KEY:-railsim}
  EMAIL_FROM: ${EMAIL_FROM:-BAIA Swimwear <orders@baia-railsim.test>}
  ADMIN_NOTIFY_EMAIL: ${ADMIN_NOTIFY_EMAIL:-store@baia-railsim.test}
  # The Owner (pinned Admin). Register this address on the sim site to become Owner.
  OWNER_EMAIL: ${OWNER_EMAIL:-owner@baia-railsim.test}
  # The sim tests the mock payment flow; production keeps this false until a real provider exists.
  PAYMENTS_ENABLED: 'true'
  # Error reporting stays off in the simulation (SENTRY_DSN deliberately not set).
  STORAGE_PROVIDER: s3
  S3_ENDPOINT: http://s3:4566
  S3_FORCE_PATH_STYLE: 'true'
  S3_PUBLIC_URL: http://baia-s3.localhost:9070
  S3_REGION: us-east-1
  S3_BUCKET: baia-assets
  S3_ACCESS_KEY: railsim
  S3_SECRET_KEY: railsim-s3-secret
  PAYMENT_PROVIDER: mock
  TRUST_PROXY: '1'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: baia
      POSTGRES_PASSWORD: baia
      POSTGRES_DB: baia_prodsim
    ports:
      - '5470:5432'
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U baia -d baia_prodsim']
      interval: 3s
      timeout: 3s
      retries: 20

  # S3-compatible storage (MinIO's images left Docker Hub). Public read comes from the init script.
  s3:
    image: localstack/localstack:3
    environment:
      SERVICES: s3
      DEFAULT_REGION: us-east-1
    ports:
      - '9070:4566'
    volumes:
      # Creates the bucket with a public-read policy (like the R2 public domain). The API does
      # NOT create buckets in production mode, so this is required for images to work.
      - ./scripts/localstack-init.sh:/etc/localstack/init/ready.d/10-init.sh:ro
    healthcheck:
      # Healthy only once the init script created the bucket.
      test: ['CMD-SHELL', 'awslocal s3api head-bucket --bucket baia-assets']
      interval: 3s
      timeout: 3s
      retries: 40

  # Railway pre-deploy command: prisma migrate deploy (same image as the API).
  migrate:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    image: baia-railsim-server
    command: ['node_modules/.bin/prisma', 'migrate', 'deploy']
    environment: *server-env
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ['tools']

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    image: baia-railsim-server
    environment: *server-env
    # Not published: like Railway, the API is only reachable on the private
    # network (through the storefront proxy).
    expose:
      - '8000'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      postgres:
        condition: service_healthy
      s3:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8000/v1/health >/dev/null || exit 1']
      interval: 5s
      timeout: 5s
      retries: 30

  client:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: http://localhost:3070
        NEXT_PUBLIC_API_URL: /v1
        API_INTERNAL_URL: http://server:8000
        IMAGE_REMOTE_PATTERNS: http://baia-s3.localhost:9070
    image: baia-railsim-client
    environment:
      API_INTERNAL_URL: http://server:8000
    ports:
      - '3070:3000'
    extra_hosts:
      - 'baia-s3.localhost:host-gateway'
    depends_on:
      server:
        condition: service_healthy

volumes:
  pg_data:
