# Self-hosted production stack (single Docker host behind your own TLS proxy).
# Railway does NOT use this file - see docs/DEPLOYMENT.md.
#
#   cp .env.production.example .env.production   # fill in real values (never commit it)
#   docker compose --env-file .env.production -f docker-compose.prod.yml build
#   docker compose --env-file .env.production -f docker-compose.prod.yml run --rm migrate
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d
#
# Topology = Railway's: only the storefront is published; it proxies /v1 and
# /api/auth to the API on the internal network (first-party cookies).
# Terminate TLS in front of port 3000 (Caddy, Traefik, nginx, Cloudflare).

x-server-env: &server-env
  NODE_ENV: production
  PORT: '8000'
  DATABASE_URL: postgresql://${POSTGRES_USER:-baia}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-baia}?schema=public
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
  BETTER_AUTH_URL: ${SITE_URL:?set SITE_URL}
  CLIENT_URL: ${SITE_URL}
  TRUST_PROXY: ${TRUST_PROXY:-1}
  EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  EMAIL_FROM: ${EMAIL_FROM:-}
  ADMIN_NOTIFY_EMAIL: ${ADMIN_NOTIFY_EMAIL:-}
  STORAGE_PROVIDER: s3
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
  S3_PUBLIC_URL_INCLUDES_BUCKET: ${S3_PUBLIC_URL_INCLUDES_BUCKET:-true}
  S3_REGION: ${S3_REGION:-auto}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-}
  S3_BUCKET: ${S3_BUCKET:-baia-assets}
  CDN_URL: ${CDN_URL:-}
  PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-baia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-baia}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-baia}']
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    image: baia-server
    command: ['node_modules/.bin/prisma', 'migrate', 'deploy']
    environment: *server-env
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ['tools']

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    image: baia-server
    restart: unless-stopped
    environment: *server-env
    expose:
      - '8000'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8000/v1/health >/dev/null || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5

  client:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${SITE_URL}
        NEXT_PUBLIC_API_URL: /v1
        API_INTERNAL_URL: http://server:8000
        IMAGE_REMOTE_PATTERNS: ${IMAGE_REMOTE_PATTERNS:-}
        NEXT_PUBLIC_CONTACT_EMAIL: ${NEXT_PUBLIC_CONTACT_EMAIL:-}
    image: baia-client
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://server:8000
    ports:
      - '3000:3000'
    depends_on:
      server:
        condition: service_healthy

volumes:
  postgres_data:
