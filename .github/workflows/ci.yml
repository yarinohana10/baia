name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'

jobs:
  # ──────────────────────────────────────────────────
  # 1. Lint & Typecheck
  # ──────────────────────────────────────────────────
  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @baia/server prisma:generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

  # ──────────────────────────────────────────────────
  # 2. Server Unit Tests
  # ──────────────────────────────────────────────────
  test-server:
    name: Server Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @baia/server prisma:generate

      - name: Run server tests
        run: pnpm test:server

  # ──────────────────────────────────────────────────
  # 3. Storybook Build
  # ──────────────────────────────────────────────────
  storybook:
    name: Storybook Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build Storybook
        run: pnpm build-storybook

      - name: Upload Storybook artifact
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: apps/client/storybook-static
          retention-days: 7

  # ──────────────────────────────────────────────────
  # 4. React Doctor — Code Health Gate
  # ──────────────────────────────────────────────────
  react-doctor:
    name: React Doctor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run React Doctor
        id: doctor
        uses: millionco/react-doctor@v2
        with:
          directory: apps/client
          verbose: true
          fail-on: error
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enforce minimum score
        env:
          SCORE: ${{ steps.doctor.outputs.score }}
          FLOOR: '50'
        run: |
          echo "React Doctor score: $SCORE"
          if [ -z "$SCORE" ]; then
            echo "::warning::Score not available (offline mode). Skipping threshold check."
            exit 0
          fi
          if [ "$SCORE" -lt "$FLOOR" ]; then
            echo "::error::React Doctor score $SCORE is below the minimum threshold of $FLOOR"
            exit 1
          fi
          echo "✅ Score $SCORE meets the minimum threshold of $FLOOR"
