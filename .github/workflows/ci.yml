name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

env:
  # 24.9+: Jest needs native require(esm) to load better-auth (ESM-only) in server tests.
  NODE_VERSION: '24'

jobs:
  # ──────────────────────────────────────────────────
  # 1. Lint & Typecheck
  # ──────────────────────────────────────────────────
  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @baia/server prisma:generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

  # ──────────────────────────────────────────────────
  # 2. Server Unit Tests
  # ──────────────────────────────────────────────────
  test-server:
    name: Server Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @baia/server prisma:generate

      - name: Run server tests
        run: pnpm test:server

  # ──────────────────────────────────────────────────
  # 2b. Server E2E (real Postgres) + migration drift check
  # ──────────────────────────────────────────────────
  test-e2e:
    name: Server E2E & Migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: baia
          POSTGRES_PASSWORD: baia
          POSTGRES_DB: baia_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U baia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # e2e refuses any database whose name does not end in _test; it creates it via `prisma db push`.
      TEST_DATABASE_URL: postgresql://baia:baia@localhost:5432/baia_ci_test?schema=public
      MIGRATE_CHECK_URL: postgresql://baia:baia@localhost:5432/baia_ci?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @baia/server prisma:generate

      - name: Apply migrations to an empty database
        working-directory: apps/server
        run: DATABASE_URL="$MIGRATE_CHECK_URL" pnpm exec prisma migrate deploy

      - name: Fail if schema.prisma has changes without a migration
        working-directory: apps/server
        run: |
          pnpm exec prisma migrate diff \
            --from-url "$MIGRATE_CHECK_URL" \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code \
            || { echo "::error::schema.prisma differs from prisma/migrations. Run: pnpm --filter @baia/server prisma:migrate:dev --name <change>"; exit 1; }

      - name: Run server e2e tests
        run: pnpm --filter @baia/server test:e2e

  # ──────────────────────────────────────────────────
  # 2c. Client unit tests
  # ──────────────────────────────────────────────────
  test-client:
    name: Client Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run client unit tests
        run: pnpm --filter @baia/client test

  # ──────────────────────────────────────────────────
  # 2d. Production Docker images (build only, no push)
  # ──────────────────────────────────────────────────
  docker:
    name: Docker Build (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: server
            build-args: ''
          # `next build` validates its env; build in Railway proxy mode with placeholder origins.
          - app: client
            build-args: |
              NEXT_PUBLIC_SITE_URL=https://ci.baia.invalid
              NEXT_PUBLIC_API_URL=/v1
              API_INTERNAL_URL=http://server.railway.internal:8000
              IMAGE_REMOTE_PATTERNS=https://images.baia.invalid
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.app }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: false
          load: false
          build-args: ${{ matrix.build-args }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  # ──────────────────────────────────────────────────
  # 3. Storybook Build
  # ──────────────────────────────────────────────────
  storybook:
    name: Storybook Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build Storybook
        run: pnpm build-storybook

      - name: Upload Storybook artifact
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: apps/client/storybook-static
          retention-days: 7

  # ──────────────────────────────────────────────────
  # 4. React Doctor — Code Health Gate
  # ──────────────────────────────────────────────────
  react-doctor:
    name: React Doctor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run React Doctor
        id: doctor
        uses: millionco/react-doctor@v2
        with:
          directory: apps/client
          verbose: true
          fail-on: error
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enforce minimum score
        env:
          SCORE: ${{ steps.doctor.outputs.score }}
          FLOOR: '50'
        run: |
          echo "React Doctor score: $SCORE"
          if [ -z "$SCORE" ]; then
            echo "::warning::Score not available (offline mode). Skipping threshold check."
            exit 0
          fi
          if [ "$SCORE" -lt "$FLOOR" ]; then
            echo "::error::React Doctor score $SCORE is below the minimum threshold of $FLOOR"
            exit 1
          fi
          echo "✅ Score $SCORE meets the minimum threshold of $FLOOR"
