# Infrastructure only — Postgres + LocalStack for local development.
# Usage:  docker compose -f docker-compose.infra.yml up -d
# Or via: pnpm dev:infra

services:
  postgres:
    image: postgres:16-alpine
    container_name: baia-postgres
    environment:
      POSTGRES_USER: baia
      POSTGRES_PASSWORD: baia
      POSTGRES_DB: baia
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baia"]
      interval: 5s
      timeout: 5s
      retries: 5

  localstack:
    image: localstack/localstack:3
    container_name: baia-localstack
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3
      DEFAULT_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - localstack_data:/var/lib/localstack
      - ./scripts/localstack-init.sh:/etc/localstack/init/ready.d/init.sh
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health | grep -q '\"s3\": \"running\"' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  localstack_data:
